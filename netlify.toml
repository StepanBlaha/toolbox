[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — real files (incl. per-route index.html) are served first;
# only unmatched paths fall through to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
